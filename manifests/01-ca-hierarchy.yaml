# ---------------------------------------------------------------------------
# 01-ca-hierarchy.yaml
#
# Root + intermediate CA, built entirely with cert-manager self-signed /
# CA issuers. Everything here lives in the `cert-manager` namespace, which
# must match cert-manager's --cluster-resource-namespace flag (default is
# "cert-manager"). Confirm with:
#
#   kubectl get deploy cert-manager -n cert-manager \
#     -o jsonpath='{.spec.template.spec.containers[0].args}'
#
# Apply this file first, then wait for both Certificates to be Ready
# before applying anything else. See DEPLOY.md for the full sequence.
# ---------------------------------------------------------------------------

# ---- bootstrap issuer, only ever used to self-sign the root ----
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
# ---- root CA, long-lived (20y) ----
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: root-ca
  secretName: root-ca-secret
  duration: 175200h        # 20y
  renewBefore: 8760h       # 1y
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
# ---- wrap the root secret in an issuer so it can sign the intermediate ----
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: root-ca-issuer
spec:
  ca:
    secretName: root-ca-secret
---
# ---- intermediate CA (10y) — this is the one every workload trusts ----
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: intermediate-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: intermediate-ca
  secretName: intermediate-ca-secret
  duration: 87600h         # 10y
  renewBefore: 8760h       # 1y
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  issuerRef:
    name: root-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# ---- shared issuer that every leaf certificate (mysql/redis/rabbitmq/
#      minio/your-app, etc.) uses ----
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: shared-ca
spec:
  ca:
    secretName: intermediate-ca-secret
---
# ---- optional: dedicated issuer wrapping the ROOT (not intermediate)
#      secret. Useful for operators (e.g. Percona XtraDB Cluster) that
#      want to own their own CA chain via spec.tls.issuerConf while still
#      rooting trust at the same place as everything else. Delete this
#      block if you don't need it. ----
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: root-ca-passthrough
spec:
  ca:
    secretName: root-ca-secret
